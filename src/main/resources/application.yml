spring:
  application:
    name: agenda
  docker:
    compose:
      file: infra/docker/compose-infra.yaml

  messages:
    basename: messages
    encoding: UTF-8

  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yaml
    enabled: true


logging:
  level:
    software.amazon.awssdk: INFO
    org.springframework.scheduling: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true

